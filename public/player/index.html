<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Player - Mini Digital Signage</title>
  
  <!-- PWA & iOS Specific Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Signage">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="player-container">
    <!-- Invisible sleep preventer video to block screen auto-lock (NoSleep simulation) -->
    <video id="sleep-preventer" loop muted playsinline style="position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none;"></video>

    <!-- Image element -->
    <img id="signage-image" src="" alt="Sinalização Digital" style="display: none;">
    
    <!-- Video element (highly compatible configuration) -->
    <video id="signage-video" src="" loop muted playsinline autoplay style="display: none;"></video>
    
    <!-- Weather Widget -->
    <div id="weather-widget" class="widget-container" style="display: none;">
      <div class="weather-box">
        <h2 id="weather-city">Previsão do Tempo</h2>
        <div class="weather-main">
          <span id="weather-icon" class="weather-large-icon">☀️</span>
          <span id="weather-temp" class="weather-temp">--°C</span>
        </div>
        <p id="weather-desc" class="weather-desc">Carregando clima...</p>
        <div id="weather-forecast" class="weather-forecast-row"></div>
      </div>
    </div>

    <!-- News Widget -->
    <div id="news-widget" class="widget-container" style="display: none;">
      <div id="news-bg" class="news-background"></div>
      <div class="news-overlay"></div>
      <div class="news-content-box">
        <span class="news-badge">ESPORTE MUNDIAL</span>
        <h1 id="news-title">Buscando as últimas notícias...</h1>
        <p id="news-desc">Carregando feed de notícias esportivas...</p>
      </div>
    </div>

    <!-- Instagram Widget -->
    <div id="instagram-widget" class="widget-container" style="display: none;">
      <iframe id="instagram-iframe" src="" style="width: 100%; height: 100%; border: none; overflow: hidden; background: #000;" scrolling="no"></iframe>
    </div>
    
    <!-- Autoplay Fallback Overlay -->
    <div id="play-overlay" class="overlay" style="display: none;">
      <div class="overlay-button">
        <span class="icon">▶</span>
        <span class="text">TOQUE PARA INICIAR</span>
      </div>
    </div>

    <!-- Diagnostic Debug Box -->
    <div id="debug-box" class="debug-panel" style="display: none;">
      <div class="debug-header">Sinalização - Diagnóstico</div>
      <div class="debug-row"><span>Status:</span> <strong id="debug-status" class="online-tag">ONLINE</strong></div>
      <div class="debug-row"><span>Sincronização:</span> <span id="debug-sync">-</span></div>
      <div class="debug-row"><span>Tipo:</span> <span id="debug-type">-</span></div>
      <div class="debug-row"><span>Media ID:</span> <span id="debug-id">-</span></div>
      <div class="debug-row"><span>Versão:</span> <span id="debug-version">-</span></div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
